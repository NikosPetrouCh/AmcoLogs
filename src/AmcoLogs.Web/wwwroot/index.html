<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmcoLogs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css?v=27">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark">AL</span>
        <div class="brand-text">
          <strong class="brand-wordmark">AmcoLogs</strong>
          <small>CTVM log desk</small>
        </div>
      </div>

      <ol class="pipeline">
        <li data-step="1" class="active">
          <button type="button" class="pipeline-btn" data-step="1">
            <span class="step">1</span>
            <div>
                <strong>Data Entry</strong>
            <small>File or Device</small>
            </div>
          </button>
        </li>
        <li data-step="2">
          <button type="button" class="pipeline-btn" data-step="2">
            <span class="step">2</span>
            <div>
              <strong>IPs</strong>
              <small>Ips_TVM360 + Ips_Mobile</small>
            </div>
          </button>
        </li>
        <li data-step="3">
          <button type="button" class="pipeline-btn" data-step="3">
            <span class="step">3</span>
            <div>
              <strong>Logs</strong>
              <small>scp -P 8022 ή drop</small>
            </div>
          </button>
        </li>
        <li data-step="4">
          <button type="button" class="pipeline-btn" data-step="4">
            <span class="step">4</span>
            <div>
              <strong>Πόρισμα</strong>
              <small>YES · NO</small>
            </div>
          </button>
        </li>
      </ol>

      <nav class="db-nav">
        <p class="db-nav-title">Database</p>
        <button type="button" class="db-link" data-db="general">General</button>
        <button type="button" class="db-link" data-db="errors">Error reports</button>
        <button type="button" class="db-link" data-db="ips">CTVM IPs</button>
        <p id="db-dot" class="db-dot">MySQL offline</p>
      </nav>
    </aside>

    <main class="stage">
      <header class="stage-head">
        <div>
          <p id="kicker" class="kicker">Βήμα 1 από 4</p>
          <h1 id="stage-title">Data Entry</h1>
          <p id="stage-lede" class="lede" hidden></p>
        </div>
      </header>

      <section id="step-excel">
        <div id="entry-choice" class="entry-choice">
          <button type="button" class="result-card" data-entry="exceptions">
            <strong>Daily Exceptions</strong>
            <p class="result-meta">Excel file</p>
          </button>
          <button type="button" class="result-card" data-entry="device">
            <strong>Device investigation</strong>
            <p class="result-meta">One CTVM</p>
          </button>
        </div>
        <div id="entry-work" hidden>
          <button type="button" id="entry-back" class="desk-up">Back</button>
          <div class="entry-grid">
            <section id="entry-device" class="panel-block entry-card" hidden>
              <h2>Device investigation</h2>
              <form id="device-entry" class="catalog-form device-entry-form">
              <label>CTVM
                <input name="ctvm" required placeholder="CTVM36246554" autocomplete="off">
              </label>
              <label>Φορέας
                <select name="operator">
                  <option value="OSETH">OSETH</option>
                  <option value="OASA">OASA</option>
                </select>
              </label>
              <label id="device-network" hidden>Δίκτυο, μέσα στον OASA
                <select name="network">
                  <option value="TRAM">TRAM</option>
                  <option value="METRO">METRO</option>
                </select>
              </label>
              <label>Τύπος σφάλματος
                <input name="faultType" placeholder="προαιρετικό" autocomplete="off">
              </label>
              <label>Αναζήτηση
                <select name="searchMode" id="device-search-mode">
                  <option value="transaction">Μία συναλλαγή</option>
                  <option value="range">Εύρος ημερομηνιών</option>
                </select>
              </label>
              <label>Service
                <select name="logService" id="device-log-service">
                  <option value="middleware">middleware.service</option>
                  <option value="coinman.service">coinman.service</option>
                  <option value="bnr.service">bnr.service</option>
                  <option value="printman.service">printman.service</option>
                  <option value="frontman.service">frontman.service</option>
                </select>
              </label>
              <label id="device-log-date">Ημερομηνία log
                <input name="logDate" type="date">
              </label>
              <label id="device-clock">Ώρα συναλλαγής
                <input name="clockTime" placeholder="08:23" inputmode="numeric" autocomplete="off">
              </label>
              <label id="device-range-from" hidden>Από
                <input name="rangeFrom" type="date">
              </label>
              <label id="device-range-until" hidden>Έως
                <input name="rangeUntil" type="date">
              </label>
              <label id="device-grep" hidden>Log για grep
                <input name="grepText" placeholder="το κείμενο που ψάχνεις" autocomplete="off">
              </label>
              <button type="submit">Καταχώρηση</button>
            </form>
            <p id="device-entry-error" class="status-line error" hidden></p>
            </section>
            <section id="entry-file" class="panel-block entry-card" hidden>
              <h2>Daily Exceptions</h2>
            <section id="dropzone" class="dropzone">
              <input id="file-input" type="file" accept=".xlsx,.xlsm" hidden>
              <p class="drop-title">Drop Excel εδώ</p>
              <p class="drop-copy">ή <button type="button" id="browse">επίλεξε αρχείο</button> · .xlsx</p>
            </section>
            </section>
          </div>
        </div>
        <p id="status-line" class="status-line" hidden></p>
        <section id="summary" class="summary" hidden></section>
        <section id="categories" class="categories" hidden></section>
        <section id="selection" class="selection" hidden></section>
      </section>

      <section id="step-ips" hidden>
        <section id="ip-body" class="panel-block"></section>
      </section>

      <section id="step-download" hidden>
        <section id="dl-body" class="panel-block"></section>
      </section>

      <section id="step-process" hidden>
        <section id="pr-body" class="panel-block"></section>
      </section>

      <section id="db-view" hidden>
        <section class="panel-block db-connect">
          <p id="db-status" class="db-status pending">Checking MySQL…</p>
          <details>
            <summary>Connection</summary>
            <form id="db-form" class="db-form">
              <label>Host <input name="host" value="localhost" autocomplete="off"></label>
              <label>Port <input name="port" type="number" value="3306"></label>
              <label>User <input name="user" value="root" autocomplete="off"></label>
              <label>Password <input name="password" type="password" autocomplete="current-password"></label>
              <label>Database <input name="database" value="amco_logs" autocomplete="off"></label>
              <button type="submit">Connect and create database</button>
            </form>
          </details>
        </section>
        <section id="db-body" class="panel-block"></section>
      </section>
    </main>
  </div>
  <script src="/js/app.js?v=47"></script>
</body>
</html>
